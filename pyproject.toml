[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-gen"
version = "1.0.0"
description = "Synthetic customer-segmentation data generator with explainable RFM segments and action recommendations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
segmentation-gen = "segmentation_gen.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
